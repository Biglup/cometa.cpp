version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - doxygen
    - cmake
  jobs:
    post_install:
      - cmake -S doc -B build/docs
      - cmake --build build/docs --target doc_doxygen
sphinx:
  configuration: build/docs/conf.py
  fail_on_warning: true
python:
  install:
    - requirements: doc/requirements.txt
